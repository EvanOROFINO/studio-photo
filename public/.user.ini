; Limites PHP adaptées à l'envoi de photos depuis l'admin.
; Lu par PHP-FPM / CGI (cas de la plupart des hébergements mutualisés) ; ignoré par mod_php.
; Les valeurs par défaut de PHP (2 Mo par fichier) refuseraient la majorité des photos.
upload_max_filesize = 32M
post_max_size = 40M
memory_limit = 256M
max_execution_time = 60
