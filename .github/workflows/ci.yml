name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: PHPUnit + lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint Twig templates
        run: php bin/console lint:twig templates/ --env=test

      - name: Lint YAML config
        run: php bin/console lint:yaml config/ --parse-tags --env=test

      - name: Lint Symfony container
        run: php bin/console lint:container --env=test

      - name: Validate Doctrine schema mapping
        run: php bin/console doctrine:schema:validate --skip-sync --env=test --no-interaction

      - name: Run PHPUnit
        env:
          APP_ENV: test
        run: vendor/bin/phpunit --testdox

  security:
    name: Composer security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Audit dependencies
        run: composer audit --no-interaction
