liip_imagine:
    driver: 'gd'

    resolvers:
        default:
            web_path:
                web_root: '%kernel.project_dir%/public'
                cache_prefix: 'media/cache'

    loaders:
        default:
            filesystem:
                data_root:
                    - '%kernel.project_dir%/public'

    filter_sets:
        # Vignette pour grille de galerie / cards (responsive — colonne ~400px)
        thumbnail:
            quality: 82
            format: webp
            filters:
                thumbnail: { size: [600, 600], mode: inset }

        # Variante haute densité (2× pour écrans Retina)
        thumbnail_2x:
            quality: 82
            format: webp
            filters:
                thumbnail: { size: [1200, 1200], mode: inset }

        # Cartes blog / cards horizontales (16:10)
        card:
            quality: 82
            format: webp
            filters:
                thumbnail: { size: [800, 500], mode: outbound }

        card_2x:
            quality: 82
            format: webp
            filters:
                thumbnail: { size: [1600, 1000], mode: outbound }

        # Image pleine taille (page détail photo / cover blog)
        full:
            quality: 88
            format: webp
            filters:
                thumbnail: { size: [1600, 1600], mode: inset }

        # Cover article 1200×630 — taille recommandée pour Open Graph
        og_cover:
            quality: 85
            format: jpg
            filters:
                thumbnail: { size: [1200, 630], mode: outbound }

        # Hero plein écran
        hero:
            quality: 85
            format: webp
            filters:
                thumbnail: { size: [1920, 1080], mode: outbound }
